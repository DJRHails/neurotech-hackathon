[project]
name = "ssvep-lsl"
version = "0.1.0"
description = "Real-time SSVEP BCI with LSL data acquisition and CCA classification"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "mne>=1.6.0",
    "numpy>=1.26.0",
    "psychopy>=2024.1.0",
    "psychopy-visionscience>=0.0.7",
    "pylsl>=1.16.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle - let types and names document the code
    "COM812",  # trailing comma - conflicts with formatter
    "ISC001",  # implicit string concat - conflicts with formatter
    "T20",     # flake8-print - we use loguru but some scripts need print
    "FBT",     # boolean trap - too noisy for scientific code
    "S101",    # assert - used in scientific scripts for sanity checks
    "PLR0913", # too many arguments - scientific functions often need many params
    "ANN",     # annotations - we add them but don't want lint errors everywhere
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "PLR2004"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.11"

[tool.uv]
environments = ["sys_platform == 'darwin'"]

# psychopy pins pyobjc==7.3 which fails to build (missing pkg_resources).
# Override to a modern version that ships wheels.
override-dependencies = [
    "pyobjc>=10.0",
]
